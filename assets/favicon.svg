<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0b0f19" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#favGrad)" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Neural node connections -->
  <path d="M18 32 L32 18 M18 32 L32 46 M32 18 L46 32 M32 46 L46 32 M32 18 L32 46 M18 32 L46 32" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Core Nodes -->
  <circle cx="18" cy="32" r="4.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="32" cy="18" r="4.5" fill="#818cf8" filter="url(#glow)" />
  <circle cx="32" cy="46" r="4.5" fill="#818cf8" filter="url(#glow)" />
  <circle cx="46" cy="32" r="5" fill="#c084fc" filter="url(#glow)" />
  
  <!-- Central Pulse -->
  <circle cx="32" cy="32" r="3" fill="#ffffff" />
