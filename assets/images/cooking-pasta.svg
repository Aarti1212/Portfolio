<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="pastaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c130c" />
      <stop offset="100%" stop-color="#090604" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="panGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="600" height="340" rx="16" fill="url(#pastaBg)" />
  <rect x="2" y="2" width="596" height="336" rx="14" stroke="#382513" stroke-width="1.5" />
  <circle cx="300" cy="170" r="140" fill="url(#panGlow)" />

  <!-- Pasta Bowl / Plate Rim -->
  <circle cx="300" cy="170" r="115" fill="#141110" stroke="#78350f" stroke-width="2" />
  <circle cx="300" cy="170" r="95" fill="#1d1612" stroke="#451a03" stroke-width="1.5" />

  <!-- Artisanal Swirled Pasta Ribbons -->
  <path d="M 230,170 Q 255,120 300,135 T 370,170 T 300,210 T 230,170 Z" fill="none" stroke="url(#amberGrad)" stroke-width="7" stroke-linecap="round" />
  <path d="M 245,155 Q 280,130 325,145 T 355,185 T 285,195 T 245,155 Z" fill="none" stroke="#fef08a" stroke-width="5" stroke-linecap="round" opacity="0.9" />
  <path d="M 260,175 Q 295,150 335,160 T 340,195 T 275,180" fill="none" stroke="#fbbf24" stroke-width="4.5" stroke-linecap="round" />

  <!-- Basil Leaves & Cherry Tomatoes -->
  <circle cx="330" cy="140" r="9" fill="#ef4444" />
  <circle cx="333" cy="138" r="2.5" fill="#fca5a5" />
  <circle cx="265" cy="190" r="8" fill="#dc2626" />
  
  <!-- Basil Leaves -->
  <path d="M 300,125 C 290,110 320,110 310,128 Z" fill="#16a34a" />
  <path d="M 270,150 C 255,145 265,130 278,142 Z" fill="#22c55e" />

  <!-- Fork & Wheat Flour Emblems -->
  <g opacity="0.5" stroke="#f59e0b" stroke-width="1.5">
    <path d="M 70,80 L 110,80 M 90,60 L 90,120" stroke-linecap="round" />
    <circle cx="90" cy="80" r="25" fill="none" />
  </g>
  <text x="90" y="85" font-family="sans-serif" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="bold">00</text>
  <text x="90" y="125" font-family="sans-serif" font-size="10" fill="#a16207" text-anchor="middle">SEMOLINA</text>

  <!-- Typography Labels -->
  <text x="300" y="45" font-family="sans-serif" font-size="13" font-weight="700" fill="#fbbf24" letter-spacing="3" text-anchor="middle">HANDMADE PASTA CRAFT</text>
  <text x="300" y="310" font-family="monospace" font-size="11" fill="#a16207" text-anchor="middle">Semolina • Free-range Yolks • Emulsified Sauces</text>
</svg>
