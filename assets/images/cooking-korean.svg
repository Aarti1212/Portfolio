<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="korBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e14" />
      <stop offset="100%" stop-color="#080406" />
    </linearGradient>
    <linearGradient id="gochuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <radialGradient id="bowlGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="600" height="340" rx="16" fill="url(#korBg)" />
  <rect x="2" y="2" width="596" height="336" rx="14" stroke="#3b1523" stroke-width="1.5" />
  <circle cx="300" cy="170" r="140" fill="url(#bowlGlow)" />

  <!-- Dolsot Stone Bowl Rim -->
  <circle cx="300" cy="170" r="110" fill="#18181b" stroke="#3f3f46" stroke-width="3" />
  <circle cx="300" cy="170" r="92" fill="#27272a" />

  <!-- Bibimbap Toppings Arranged Radiantly -->
  <!-- Rice Bed (Center) -->
  <circle cx="300" cy="170" r="45" fill="#fafafa" opacity="0.9" />

  <!-- Segment 1: Kimchi / Gochujang (Top) -->
  <path d="M 300,85 A 85,85 0 0,1 365,115 L 300,170 Z" fill="#dc2626" opacity="0.85" />
  <!-- Segment 2: Sautéed Spinach / Greens (Right) -->
  <path d="M 365,115 A 85,85 0 0,1 385,175 L 300,170 Z" fill="#15803d" opacity="0.85" />
  <!-- Segment 3: Carrots / Julienned (Bottom Right) -->
  <path d="M 385,175 A 85,85 0 0,1 340,245 L 300,170 Z" fill="#ea580c" opacity="0.85" />
  <!-- Segment 4: Shiitake Mushrooms (Bottom Left) -->
  <path d="M 340,245 A 85,85 0 0,1 255,240 L 300,170 Z" fill="#78350f" opacity="0.85" />
  <!-- Segment 5: Bean Sprouts (Left) -->
  <path d="M 255,240 A 85,85 0 0,1 220,165 L 300,170 Z" fill="#fef08a" opacity="0.75" />
  <!-- Segment 6: Zucchini / Squash (Top Left) -->
  <path d="M 220,165 A 85,85 0 0,1 300,85 L 300,170 Z" fill="#16a34a" opacity="0.85" />

  <!-- Center Fried Egg with runny yolk -->
  <circle cx="300" cy="170" r="28" fill="#ffffff" />
  <circle cx="300" cy="170" r="16" fill="#f59e0b" />
  <circle cx="296" cy="166" r="4" fill="#fef08a" />

  <!-- Sesame Seeds -->
  <g fill="#fef08a" opacity="0.9">
    <ellipse cx="290" cy="185" rx="1.5" ry="3" transform="rotate(25 290 185)" />
    <ellipse cx="310" cy="180" rx="1.5" ry="3" transform="rotate(-30 310 180)" />
    <ellipse cx="305" cy="155" rx="1.5" ry="3" transform="rotate(40 305 155)" />
    <ellipse cx="288" cy="160" rx="1.5" ry="3" transform="rotate(-15 288 160)" />
  </g>

  <!-- Metal Chopsticks Graphic on Side -->
  <g stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="460" y1="80" x2="495" y2="260" />
    <line x1="475" y1="80" x2="505" y2="260" />
  </g>

  <!-- Typography Labels -->
  <text x="300" y="45" font-family="sans-serif" font-size="13" font-weight="700" fill="#f43f5e" letter-spacing="3" text-anchor="middle">KOREAN COMFORT GASTRONOMY</text>
  <text x="300" y="310" font-family="monospace" font-size="11" fill="#be123c" text-anchor="middle">Stone Bowl Bibimbap • Kimchi-jjigae • Gochujang Umami</text>
</svg>
