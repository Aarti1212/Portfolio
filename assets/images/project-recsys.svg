<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="recBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e102a" />
      <stop offset="100%" stop-color="#090510" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="16" fill="url(#recBg)" />
  <rect x="2" y="2" width="596" height="336" rx="14" stroke="#3b0764" stroke-width="1.5" />

  <rect x="30" y="30" width="175" height="28" rx="14" fill="#0f172a" stroke="#e879f9" stroke-width="1" />
  <text x="117" y="49" font-family="monospace" font-size="11" fill="#e879f9" text-anchor="middle">● SASRec + Faiss HNSW</text>

  <!-- Two Towers -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="110" height="70" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1.5" />
    <text x="55" y="30" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f5d0fe" text-anchor="middle">User Tower</text>
    <text x="55" y="50" font-family="monospace" font-size="9" fill="#d8b4fe" text-anchor="middle">Sequential State</text>

    <rect x="0" y="90" width="110" height="70" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1.5" />
    <text x="55" y="120" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f5d0fe" text-anchor="middle">Item Tower</text>
    <text x="55" y="140" font-family="monospace" font-size="9" fill="#d8b4fe" text-anchor="middle">5M Catalog Embeds</text>
  </g>

  <!-- Dot Product / Faiss Index -->
  <g transform="translate(240, 110)">
    <circle cx="60" cy="60" r="50" fill="#3b0764" stroke="#f472b6" stroke-width="2" />
    <text x="60" y="55" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Faiss HNSW</text>
    <text x="60" y="75" font-family="monospace" font-size="10" fill="#f472b6" text-anchor="middle">Top-200 / 4.2ms</text>
  </g>

  <!-- Connectors -->
  <line x1="170" y1="125" x2="240" y2="150" stroke="#a855f7" stroke-width="2" />
  <line x1="170" y1="215" x2="240" y2="190" stroke="#a855f7" stroke-width="2" />

  <!-- Reranking / Feed Output -->
  <g transform="translate(420, 95)">
    <rect x="0" y="0" width="120" height="150" rx="8" fill="#180c24" stroke="#34d399" stroke-width="1.5" />
    <text x="60" y="30" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">MMoE Ranker</text>
    <text x="60" y="60" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">1. Item #8912</text>
    <text x="60" y="85" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">2. Item #4401</text>
    <text x="60" y="110" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">3. Item #0294</text>
    <text x="60" y="135" font-family="monospace" font-size="10" fill="#34d399" text-anchor="middle">+18.2% CVR</text>
  </g>

  <line x1="350" y1="170" x2="420" y2="170" stroke="#f472b6" stroke-width="2" />
</svg>
