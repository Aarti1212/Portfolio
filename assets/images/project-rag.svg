<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="ragBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="16" fill="url(#ragBg)" />
  <rect x="2" y="2" width="596" height="336" rx="14" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle grid lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.6">
    <line x1="50" y1="0" x2="50" y2="340" />
    <line x1="150" y1="0" x2="150" y2="340" />
    <line x1="300" y1="0" x2="300" y2="340" />
    <line x1="450" y1="0" x2="450" y2="340" />
    <line x1="0" y1="170" x2="600" y2="170" />
  </g>

  <!-- Query Node -->
  <rect x="50" y="135" width="100" height="70" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="2" />
  <text x="100" y="165" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">USER QUERY</text>
  <text x="100" y="185" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">q_embed(x)</text>

  <!-- Flow Arrow -->
  <line x1="150" y1="170" x2="200" y2="170" stroke="#38bdf8" stroke-width="2" />
  <polygon points="198,165 208,170 198,175" fill="#38bdf8" />

  <!-- Dual Retrieval Nodes -->
  <rect x="210" y="90" width="130" height="60" rx="10" fill="#111827" stroke="#818cf8" stroke-width="1.5" />
  <text x="275" y="118" font-family="sans-serif" font-size="12" font-weight="bold" fill="#818cf8" text-anchor="middle">Dense Qdrant</text>
  <text x="275" y="136" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">HNSW Cosine</text>

  <rect x="210" y="190" width="130" height="60" rx="10" fill="#111827" stroke="#a855f7" stroke-width="1.5" />
  <text x="275" y="218" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a855f7" text-anchor="middle">Sparse BM25</text>
  <text x="275" y="236" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">Keyword Exact</text>

  <!-- Connections to Reranker -->
  <line x1="340" y1="120" x2="380" y2="150" stroke="#818cf8" stroke-width="2" />
  <line x1="340" y1="220" x2="380" y2="190" stroke="#a855f7" stroke-width="2" />

  <!-- Cross-Encoder Reranker -->
  <rect x="380" y="135" width="90" height="70" rx="10" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2" />
  <text x="425" y="165" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">RRF + Cross</text>
  <text x="425" y="185" font-family="monospace" font-size="10" fill="#34d399" text-anchor="middle">Ranker Top-5</text>

  <!-- Final Stream LLM Generator -->
  <line x1="470" y1="170" x2="500" y2="170" stroke="#34d399" stroke-width="2" />
  <polygon points="498,165 508,170 498,175" fill="#34d399" />

  <rect x="500" y="130" width="80" height="80" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="2" />
  <text x="540" y="165" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">vLLM</text>
  <text x="540" y="185" font-family="monospace" font-size="10" fill="#6ee7b7" text-anchor="middle">Stream Out</text>

  <!-- Metric badge in corner -->
  <rect x="30" y="30" width="130" height="28" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="1" />
  <text x="95" y="49" font-family="monospace" font-size="11" fill="#34d399" text-anchor="middle">● P95 Latency: 138ms</text>
</svg>
