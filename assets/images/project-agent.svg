<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="agentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="16" fill="url(#agentBg)" />
  <rect x="2" y="2" width="596" height="336" rx="14" stroke="#1e293b" stroke-width="1.5" />

  <!-- Metric badge -->
  <rect x="30" y="30" width="160" height="28" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
  <text x="110" y="49" font-family="monospace" font-size="11" fill="#818cf8" text-anchor="middle">● LangGraph Multi-Agent</text>

  <!-- Supervisor Node -->
  <circle cx="300" cy="110" r="40" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5" />
  <text x="300" y="108" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">Supervisor</text>
  <text x="300" y="124" font-family="monospace" font-size="10" fill="#818cf8" text-anchor="middle">Agent</text>

  <!-- Sub-agents -->
  <g transform="translate(90, 210)">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
    <text x="50" y="28" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">Telemetry</text>
    <text x="50" y="46" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Prometheus</text>
  </g>

  <g transform="translate(250, 210)">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="#111827" stroke="#34d399" stroke-width="1.5" />
    <text x="50" y="28" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">Log Cluster</text>
    <text x="50" y="46" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Vector Anomaly</text>
  </g>

  <g transform="translate(410, 210)">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="#111827" stroke="#f43f5e" stroke-width="1.5" />
    <text x="50" y="28" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f43f5e" text-anchor="middle">K8s Patch</text>
    <text x="50" y="46" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Safety Sandbox</text>
  </g>

  <!-- Flow Lines -->
  <line x1="280" y1="145" x2="140" y2="210" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 3" />
  <line x1="300" y1="150" x2="300" y2="210" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 3" />
  <line x1="320" y1="145" x2="460" y2="210" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 3" />
</svg>
