<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a11" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="glowPoint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <circle cx="950" cy="200" r="350" fill="url(#glowPoint)" />
  
  <!-- Grid overlay -->
  <g stroke="#1e293b" stroke-width="1" stroke-opacity="0.4">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Branding Badge -->
  <rect x="80" y="80" width="220" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="102" cy="101" r="6" fill="#34d399" />
  <text x="120" y="107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#38bdf8" letter-spacing="1">AI / ML PORTFOLIO</text>

  <!-- Title & Tagline -->
  <text x="80" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#f8fafc">Alex Rivera</text>
  <text x="80" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="url(#textGrad)">Senior AI / ML & GenAI Engineer</text>
  
  <text x="80" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">Building production RAG pipelines, LLM systems, and autonomous agent workflows.</text>

  <!-- Key Badges -->
  <g transform="translate(80, 420)">
    <rect x="0" y="0" width="160" height="44" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="80" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">⚡ Hybrid RAG</text>
    
    <rect x="180" y="0" width="190" height="44" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="275" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">🤖 Multi-Agent LLMs</text>

    <rect x="390" y="0" width="170" height="44" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="475" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">🎯 LoRA & DPO</text>

    <rect x="580" y="0" width="170" height="44" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="665" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">🚀 vLLM & MLOps</text>
  </g>

  <!-- Bottom Details -->
  <text x="80" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#64748b">github.com/alexrivera-ai • San Francisco / Remote • Open for Senior/Staff Roles</text>
  
  <!-- Abstract Node Graphic Right Side -->
  <g transform="translate(850, 180)">
    <circle cx="80" cy="80" r="14" fill="#38bdf8" />
    <circle cx="220" cy="40" r="10" fill="#818cf8" />
    <circle cx="200" cy="200" r="12" fill="#c084fc" />
    <circle cx="50" cy="220" r="10" fill="#34d399" />
    <circle cx="150" cy="130" r="18" fill="#38bdf8" />
    <line x1="80" y1="80" x2="150" y2="130" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.7" />
    <line x1="220" y1="40" x2="150" y2="130" stroke="#818cf8" stroke-width="2.5" stroke-opacity="0.7" />
    <line x1="200" y1="200" x2="150" y2="130" stroke="#c084fc" stroke-width="2.5" stroke-opacity="0.7" />
    <line x1="50" y1="220" x2="150" y2="130" stroke="#34d399" stroke-width="2.5" stroke-opacity="0.7" />
    <line x1="80" y1="80" x2="50" y2="220" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="220" y1="40" x2="200" y2="200" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4" />
  </g>
</svg>
