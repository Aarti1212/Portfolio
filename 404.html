<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Aarti Barve</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    .not-found-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-8);
      background: radial-gradient(circle at center, rgba(56, 189, 248, 0.08) 0%, transparent 70%);
    }
    .error-code {
      font-size: clamp(6rem, 15vw, 10rem);
      font-weight: 800;
      line-height: 1;
      background: var(--grad-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: var(--space-2);
      font-family: var(--font-mono);
    }
  </style>
</head>
<body>
  <div class="not-found-wrapper">
    <div class="error-code">404</div>
    <h1 style="margin-bottom: var(--space-3); font-size: 2rem;">Vector Node Not Found</h1>
    <p style="color: var(--text-secondary); max-width: 480px; margin-bottom: var(--space-8);">
      The embedding coordinate you're searching for does not exist in this vector space or has been relocated.
    </p>
    <div style="display: flex; gap: var(--space-4);">
      <a href="index.html" class="btn btn-primary">Return to Portfolio Homepage</a>
      <a href="index.html#projects" class="btn btn-secondary">Explore Projects</a>
    </div>
  </div>
</body>
</html>
